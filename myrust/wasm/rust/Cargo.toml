[package]
name = "rust-wasm-demo"
version = "0.1.0"
edition = "2021"
description = "A Rust WebAssembly demo project"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Window",
    "Node",
    "console",
]

[profile.release]
opt-level = "s"
lto = true
